[package]
name = "monitor-runtime"
version = "0.2.0"
edition = "2021"

[dependencies]
monitor-core = { path = "../monitor-core" }
monitor-store = { path = "../monitor-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
fs2 = "0.4"
dunce = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rand = "0.9"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
