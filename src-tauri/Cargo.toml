[package]
name = "clash-traffic-monitor-desktop"
version = "0.2.0"
edition = "2021"
default-run = "ClashTrafficMonitor"

[[bin]]
name = "ClashTrafficMonitor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
monitor-core = { path = "../crates/monitor-core" }
monitor-store = { path = "../crates/monitor-store" }
monitor-runtime = { path = "../crates/monitor-runtime" }
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-notification = "2"
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
